<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Trading — Static Preview</title>
    <style>
      :root{--bg:#071226;--card:#081827;--card-2:#0f2430;--accent:#06b6d4;--accent-2:#00ffd1;--muted:#94a3b8;--text:#e6eef8}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#051226,#071226);color:var(--text);-webkit-font-smoothing:antialiased}
      .app{display:flex;flex-direction:column;height:100vh}
      .topbar{padding:14px;text-align:center;font-weight:700;letter-spacing:0.2px}
      .content{flex:1;padding:18px 14px 120px;overflow:auto}
      .page h2{margin:0 0 8px;font-size:18px}
      .card{background:linear-gradient(180deg,var(--card),var(--card-2));padding:14px;border-radius:12px;margin-top:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
      .muted{color:var(--muted);font-size:13px}
      .primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#042a2f;padding:10px 14px;border-radius:12px;border:0;font-weight:700}

      /* account list */
      .accounts-row{display:flex;gap:10px;overflow:auto;padding-bottom:6px}
      .acct{min-width:180px;padding:12px;border-radius:10px;background:rgba(255,255,255,0.02)}
      .acct .balance{font-weight:700;font-size:16px}

      /* portfolio sparkline */
      .spark{width:100%;height:48px}

      /* trades */
      .trades li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,0.02)}
      .badge{background:rgba(6,182,212,0.12);color:var(--accent);padding:4px 8px;border-radius:999px;font-weight:700;font-size:12px}

      /* bottom nav */
      .bottom-wrap{position:fixed;left:12px;right:12px;bottom:12px;height:76px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:8px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));box-shadow:0 12px 30px rgba(2,6,23,0.6)}
      .nav-btn{flex:1;background:transparent;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border-radius:12px;transition:all .18s}
      .nav-btn svg{display:block}
      .nav-btn .label{font-size:11px;margin-top:4px}
      .nav-btn.active{color:var(--accent);transform:translateY(-4px)}

      /* central action (trade) */
      .trade-action{position:absolute;left:50%;transform:translateX(-50%);bottom:32px;width:66px;height:66px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#00e5c8);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(6,182,212,0.18);border:4px solid rgba(255,255,255,0.03);z-index:30;transition:transform .18s}
      .trade-action:active{transform:translateX(-50%) scale(.98)}
      .trade-action svg{filter:drop-shadow(0 6px 18px rgba(2,6,23,0.4))}

      /* small animation */
      .pulse{animation:pulse 2s infinite}
      @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

      @media(min-width:720px){.content{padding:24px}}
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">AI Trading Bot</header>
      <main class="content" id="content"></main>

      <nav class="bottom-wrap" role="navigation" id="nav">
        <button class="nav-btn" data-route="accounts" aria-label="Accounts">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="label">Accounts</span>
        </button>

        <button class="nav-btn" data-route="myrobot" aria-label="My Robot">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 7V5a5 5 0 0 1 10 0v2"/></svg>
          <span class="label">My Robot</span>
        </button>

        <div style="width:66px"></div>

        <button class="nav-btn" data-route="trade" aria-label="Trade">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h18"/><path d="M8 5l4-3 4 3"/><path d="M16 19l-4 3-4-3"/></svg>
          <span class="label">Trade</span>
        </button>

        <button class="nav-btn" data-route="settings" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 2.27 17l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09c.7 0 1.3-.38 1.51-1a1.65 1.65 0 0 0-.33-1.82L4.27 3.66A2 2 0 1 1 7.1.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V1a2 2 0 1 1 4 0v.09c0 .7.38 1.3 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06A2 2 0 1 1 21.73 6.1l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.19.6.8 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.7 0-1.3.38-1.51 1z"/></svg>
          <span class="label">Settings</span>
        </button>
      </nav>

      <button class="trade-action pulse" id="tradeAction" aria-label="Quick Trade">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#042a2f" stroke-width="1.6"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
    </div>

    <script>
      // richer mock content
      const content = document.getElementById('content')
      const nav = document.getElementById('nav')
      const tradeAction = document.getElementById('tradeAction')

      const mock = {
        accounts: [
          {name:'Binance', balance:'$12,430', change:'+3.2%'},
          {name:'Coinbase', balance:'$5,200', change:'-0.8%'},
          {name:'Kraken', balance:'$2,110', change:'+1.1%'}
        ],
        trades: [
          {pair:'BTC/USDT', side:'BUY', size:'0.002', price:'$62,450', time:'2m ago'},
          {pair:'ETH/USDT', side:'SELL', size:'0.15', price:'$3,420', time:'10m ago'},
          {pair:'SOL/USDT', side:'BUY', size:'3.2', price:'$140', time:'1h ago'}
        ]
      }

      function renderAccounts(){
        return `
          <div class="page">
            <h2>Accounts</h2>
            <p class="muted">Connected exchanges & balances</p>
            <div class="accounts-row">${mock.accounts.map(a=>`<div class="acct card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;color:var(--muted)">${a.name}</div><div class="balance">${a.balance}</div></div><div class="badge">${a.change}</div></div></div>`).join('')}</div>
            <div class="card"><h3 style="margin:0 0 8px">Portfolio</h3><svg class="spark" viewBox="0 0 120 48" preserveAspectRatio="none"><polyline fill="none" stroke="url(#g)" stroke-width="2" points="0,32 18,28 36,22 54,18 72,20 90,14 108,10 120,12"/></svg></div>
          </div>
        `
      }

      function renderMyRobot(){
        return `
          <div class="page">
            <h2>My Robot</h2>
            <p class="muted">Status, strategy and quick controls</p>
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;color:var(--muted)">Strategy</div><div style="font-weight:700">Mean Reversion</div></div><div><button class="primary">Start</button></div></div>
              <div style="margin-top:10px;color:var(--muted)">Last run: 12m ago</div>
            </div>
            <div class="card"><h3 style="margin:0 0 8px">Recent Trades</h3><ul class="trades" style="list-style:none;padding:0;margin:0">${mock.trades.map(t=>`<li><div><strong>${t.pair}</strong><div class="muted" style="font-size:12px">${t.size} • ${t.time}</div></div><div style="text-align:right"><div style="font-weight:700;color:${t.side==='BUY'? 'var(--accent)':'#ff7b7b'}">${t.side}</div><div class="muted" style="font-size:12px">${t.price}</div></div></li>`).join('')}</ul></div>
          </div>
        `
      }

      function renderTrade(){
        return `
          <div class="page">
            <h2>Quick Trade</h2>
            <p class="muted">Market orders and quick actions</p>
            <div class="card">
              <div style="display:flex;gap:8px;align-items:center"><input placeholder="Amount" style="flex:1;padding:10px;border-radius:8px;border:0;background:rgba(255,255,255,0.02);color:var(--text)"/><select style="padding:10px;border-radius:8px;border:0;background:rgba(255,255,255,0.02);color:var(--text)"><option>BTC/USDT</option><option>ETH/USDT</option></select></div>
              <div style="margin-top:12px;display:flex;gap:8px"><button class="primary" style="flex:1">Buy Market</button><button class="primary" style="flex:1;opacity:0.9">Sell Market</button></div>
            </div>
          </div>
        `
      }

      function renderSettings(){
        return `
          <div class="page">
            <h2>Settings</h2>
            <p class="muted">Preferences & integrations</p>
            <div class="card">Theme: <select><option>Dark</option><option>Light</option></select></div>
            <div class="card" style="margin-top:10px">API Keys: <div class="muted">No keys stored</div></div>
          </div>
        `
      }

      const pages = {accounts: renderAccounts, myrobot: renderMyRobot, trade: renderTrade, settings: renderSettings}

      function setRoute(r){
        content.innerHTML = pages[r]()
        nav.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.route===r))
      }

      nav.addEventListener('click', e=>{const btn=e.target.closest('.nav-btn'); if(!btn) return; setRoute(btn.dataset.route)})
      tradeAction.addEventListener('click', ()=>{ setRoute('trade'); /* flash */ tradeAction.classList.add('pulse'); setTimeout(()=>tradeAction.classList.remove('pulse'),600) })

      // initial
      setRoute('myrobot')
    </script>
  </body>
</html>
